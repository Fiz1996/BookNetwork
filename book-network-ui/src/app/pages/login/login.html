<div class="container-fluid card login-container">
    <h3 class="text-center">Login</h3>
   <hr>
  @if (errorMsg.length > 0) {
  <div class="alert alert-danger" role="alert" >

    @for (error of errorMsg; track error) {
      <p>{{error}}</p>
    }
  </div>
  }
  <div class="mb-3">
     <label  for="login" class="form-label">Email address</label>
    <input [(ngModel)]="authRequest.email"  type="email" class="form-control" id="login" placeholder="name@example.com">
  </div>

  <div class="mb-3">
    <label  for="password" class="form-label">Password</label>
    <input [(ngModel)]="authRequest.password"  type="email" class="form-control" id="password" placeholder="Password">
  </div>

  <div class="d-flex justify-content-between mb-3">
    <button type="button" class="btn btn-primary" (click)="login()" class="btn btn-primary">
      <em class="fa fa-sign-in-alt "> &nbsp;Sign in</em>
    </button>
    <div>
      Don't have an account?&nbsp;
      <button type="button" class="btn btn-link" (click)="register()">
        <em class="fa fa-user-alt "> Register</em>
      </button>
    </div>

  </div>
</div>
